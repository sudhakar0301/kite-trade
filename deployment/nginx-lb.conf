events {
    worker_connections 1024;
}

http {
    # Upstream backend servers (blue-green deployment)
    upstream backend {
        # Default to blue backend
        server backend-blue:5000;
        # server backend-green:5000;  # Uncommented during green deployment
    }
    
    # Rate limiting for API protection
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=orders:10m rate=10r/m;
    
    server {
        listen 80;
        server_name _;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Frontend - React Trading Dashboard
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Enable gzip compression
            gzip on;
            gzip_types text/plain text/css application/json application/javascript text/javascript;
        }
        
        # Backend API - General endpoints (rate limited)
        location /api {
            limit_req zone=api burst=10 nodelay;
            
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for live market data
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts for trading app
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # Order execution endpoints (strict rate limiting)
        location ~ ^/api/(buy-order|sell-order|positions) {
            limit_req zone=orders burst=2 nodelay;
            
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Longer timeout for order execution
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
        
        # Health check endpoint (no rate limiting)
        location /api/health {
            access_log off;
            proxy_pass http://backend;
        }
        
        # System health endpoint
        location /health {
            access_log off;
            return 200 "nginx healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Block access to sensitive files
        location ~ /\.(git|env|dockerfile) {
            deny all;
            return 404;
        }
    }
    
    # Logging
    access_log /var/log/nginx/trading-access.log;
    error_log /var/log/nginx/trading-error.log warn;
}